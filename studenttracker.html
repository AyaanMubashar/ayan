<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:450px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.card h2{
    color:#333;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#4f46e5;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#312e81;
}

#result{
    margin-top:10px;
    line-height:1.8;
    font-size:17px;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

    <h1>🎓 Student Management System</h1>

    <div class="card">

        <h2>Add Student</h2>

        <input type="text" id="roll" placeholder="Roll Number">

        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="age" placeholder="Age">

        <input type="number" id="marks" placeholder="Marks">

        <button onclick="addStudent()">Add Student</button>

    </div>

    <div class="card">

        <h2>Search Student</h2>

        <input type="text" id="searchRoll" placeholder="Enter Roll Number">

        <button onclick="searchStudent()">Search</button>

    </div>

    <div class="card">

        <h2>Student Details</h2>

        <div id="result">
            No student selected.
        </div>

    </div>

</div>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [];

function addStudent(){

    let roll = document.getElementById("roll").value.trim();
    let name = document.getElementById("name").value.trim();
    let age = document.getElementById("age").value.trim();
    let marks = document.getElementById("marks").value.trim();

    if(roll=="" || name=="" || age=="" || marks==""){

        alert("Please fill all fields.");
        return;

    }

    let exists = students.find(student => student.roll === roll);

    if(exists){

        alert("Student already exists.");
        return;

    }

    students.push({

        roll:roll,
        name:name,
        age:age,
        marks:marks

    });

    localStorage.setItem("students", JSON.stringify(students));

    alert("Student added successfully!");

    document.getElementById("roll").value="";
    document.getElementById("name").value="";
    document.getElementById("age").value="";
    document.getElementById("marks").value="";

}

function searchStudent(){

    let roll = document.getElementById("searchRoll").value.trim();

    let student = students.find(student => student.roll === roll);

    let result = document.getElementById("result");

    if(student){

        result.innerHTML = `
            <p><strong>Roll No:</strong> ${student.roll}</p>
            <p><strong>Name:</strong> ${student.name}</p>
            <p><strong>Age:</strong> ${student.age}</p>
            <p><strong>Marks:</strong> ${student.marks}</p>
        `;

    }

    else{

        result.innerHTML = "<p class='error'>Student Not Found</p>";

    }

}

</script>

</body>
</html>
