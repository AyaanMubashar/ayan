<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:500px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:180px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    resize:none;
}

textarea:focus{
    outline:none;
    border-color:#4f46e5;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#3730a3;
}

#result{
    margin-top:20px;
    font-size:18px;
    line-height:1.8;
}

</style>
</head>
<body>

<div class="container">

    <h1>⌨️ Typing Speed Test</h1>

    <p>
        Click <b>Start Test</b>, begin typing, then press <b>Enter</b> to finish.
    </p>

    <textarea id="typingArea" placeholder="Start typing here..." disabled></textarea>

    <button onclick="startTest()">Start Test</button>

    <div id="result"></div>

</div>

<script>

let startTime = 0;

const typingArea = document.getElementById("typingArea");

function startTest(){

    typingArea.value = "";

    typingArea.disabled = false;

    typingArea.focus();

    document.getElementById("result").innerHTML = "";

    startTime = Date.now();

}

typingArea.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        finishTest();

    }

});

function finishTest(){

    if(startTime === 0) return;

    let endTime = Date.now();

    let seconds = (endTime - startTime) / 1000;

    let text = typingArea.value.trim();

    let words = text === "" ? 0 : text.split(/\s+/).length;

    let wpm = words === 0 ? 0 : ((words / seconds) * 60).toFixed(2);

    typingArea.disabled = true;

    document.getElementById("result").innerHTML = `
        <strong>Time Taken:</strong> ${seconds.toFixed(2)} seconds<br><br>
        <strong>Words Typed:</strong> ${words}<br><br>
        <strong>Typing Speed:</strong> ${wpm} WPM
    `;

    startTime = 0;

}

</script>

</body>
</html>
